########## Logger configuration ##########
[logger]
print_level = "INFO"

########## Run output configuration ##########
[run]
save_root = "workspace/runs"
exp_name = "compact-icl-baseline"
parallelism = 2
embedding_batch_size = 256
llm_timeout = 300
progress_log_interval = 50
checkpoint_interval = 20
default_llm_profile = "qwen3_coder_instruct"

########## LLM profiles ##########
[llm_profiles.qwen3_coder_instruct]
model = "Qwen/Qwen3.5-9B"
base_url = "https://api.together.xyz/v1"
api_key = "REPLACE_WITH_TOGETHER_API_KEY"
max_tokens = 1024
extra_body = { reasoning = { enabled = false } }
temperature = 0.2
n_call_strategy = "split"
api_type = "openai"
max_model_len = 16384

[llm_profiles.local_icl]
model = "default_model"
base_url = "http://127.0.0.1:8080/v1"
api_key = "local"
max_tokens = 512
temperature = 0.0
n_call_strategy = "split"
api_type = "openai"
max_model_len = 8192
[embedding]
api_type = "local"
embedding_model_name_or_path = "sentence-transformers/all-MiniLM-L6-v2"
embedding_device = "cpu"
normalize_embeddings = true

[dataset]
type = "bird"
split = "dev"
root_path = "workspace/compact-icl/bird/benchmark"
sql_execution_timeout = 30

########## Vector database configuration ##########
[vector_database]
max_value_length = 100
lower_meta_data = true
build_backend = "local_index"

########## Few-shot index configuration ##########
[few_shot_index]
num_examples = 7
question_weight = 0.6
sql_weight = 0.4
similarity_device = "cpu"
force_rebuild = false
llm_profile = "qwen3_coder_instruct"

[few_shot_index.preliminary_sql]
enabled = true
dc_sampling_budget = 2
skeleton_sampling_budget = 2
llm_profile = "qwen3_coder_instruct"

########## Value retrieval configuration ##########
[value_retrieval]
max_values_per_column = 5
backend = "local_index"
local_index_device = "cpu"
llm_profile = "qwen3_coder_instruct"

########## Schema linking configuration ##########
[schema_linking]
direct_linking_sampling_budget = 2
reversed_linking_sampling_budget = 2
value_distance_threshold = 0.05
llm_profile = "qwen3_coder_instruct"

########## SQL generation configuration ##########
[sql_generation]
dc_sampling_budget = 2
skeleton_sampling_budget = 2
icl_sampling_budget = 1
llm_profile = "qwen3_coder_instruct"

########## SQL revision configuration ##########
icl_llm_profile = "local_icl"
icl_example_count = 7
[sql_revision]
checker_sampling_budget = 2
llm_profile = "qwen3_coder_instruct"

########## SQL selection configuration ##########
[sql_selection]
filter_top_k_sql = 2
evaluator_sampling_budget = 2
shortcut_consistency_score_threshold = 0.6
llm_profile = "qwen3_coder_instruct"

########## LLM extractor configuration ##########
[llm_extractor]
max_retry = 2
